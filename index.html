<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ward</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #080808, #252525);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      border-radius: 25px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .profile {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
      border: 4px solid white;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .username {
      color: #ccc;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .instagram {
      background: linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
    }

    .facebook {
      background: #1877f2;
    }

    .icon {
      font-size: 22px;
      margin-right: 10px;
    }

    .footer {
      margin-top: 25px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="profile">W</div>

    <h1>Ward</h1>

    <div class="username">@wardrosero</div>

    <div class="subtitle">
      Connect with me
    </div>

    <a
      class="button instagram"
      href="https://www.instagram.com/wardrosero"
      target="_blank"
      rel="noopener noreferrer">
      <span class="icon">📷</span>
      Instagram
    </a>

    <a
      class="button facebook"
      href="https://www.facebook.com/wardrosero"
      target="_blank"
      rel="noopener noreferrer">
      <span class="icon">📘</span>
      Facebook
    </a>

    <div class="footer">
      Tap • Connect • Follow
    </div>

  </div>

</body>
</html>
